<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#25306a"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="1" stop-color="#2a4f8f"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc65c" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#dfe8ff" opacity=".7">
    <circle cx="120" cy="110" r="3"/><circle cx="400" cy="420" r="3"/><circle cx="430" cy="150" r="2.5"/>
    <circle cx="90" cy="300" r="2"/><circle cx="300" cy="90" r="2"/>
  </g>
  <circle cx="210" cy="300" r="128" fill="none" stroke="#9fd0ff" stroke-opacity=".45" stroke-width="6" stroke-dasharray="10 16"/>
  <circle cx="210" cy="300" r="74" fill="url(#planet)"/>
  <g filter="url(#glow)">
    <path d="M150 412 Q 280 420 360 200" fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="364" cy="190" r="26" fill="#fff4d6"/>
  </g>
</svg>
